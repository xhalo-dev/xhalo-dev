<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="20 10 580 210" width="900" height="326">
<title>Haloxx</title>
<style>
  .ink path { fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1; }
  .shadow { stroke:#050507; transform:translate(3px,4px); }
  .main   { stroke:#F6B6CF; filter:drop-shadow(0 0 6px rgba(246,182,207,.4)); }
  .all     { animation:loopfade 13.0s infinite; }
  .eclipse { transform-origin:385px 150px; animation:pop 13.0s infinite; }
  .halo    { transform-origin:385px 150px; animation:spin 30s linear infinite; }
  .glow    { animation:glow 13.0s infinite; }
  .spark   { transform-origin:404px 128px; animation:spark 13.0s infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes b14 { 0%,10.77% {opacity:0} 14.62%,100% {opacity:1} }
  @keyframes b16 { 0%,12.31% {opacity:0} 16.15%,100% {opacity:1} }
  @keyframes b19 { 0%,14.62% {opacity:0} 18.46%,100% {opacity:1} }
  @keyframes b21 { 0%,16.15% {opacity:0} 20.00%,100% {opacity:1} }
  @keyframes b33 { 0%,25.38% {opacity:0} 29.23%,100% {opacity:1} }
  @keyframes b35 { 0%,26.92% {opacity:0} 30.77%,100% {opacity:1} }
  @keyframes d2_10 { 0%,1.54% {stroke-dashoffset:1;animation-timing-function:cubic-bezier(.8,0,.2,1)} 9.23%,100% {stroke-dashoffset:0} }
  @keyframes w2_10 { 0%,4.62% {stroke-width:3;animation-timing-function:cubic-bezier(.8,0,.2,1)} 12.31%,100% {stroke-width:11} }
  @keyframes o2_10 { 0%,1.54% {opacity:0} 3.08%,100% {opacity:1} }
  @keyframes d5_8 { 0%,3.85% {stroke-dashoffset:1;animation-timing-function:cubic-bezier(.8,0,.2,1)} 10.00%,100% {stroke-dashoffset:0} }
  @keyframes w5_8 { 0%,6.92% {stroke-width:3;animation-timing-function:cubic-bezier(.8,0,.2,1)} 13.08%,100% {stroke-width:11} }
  @keyframes o5_8 { 0%,3.85% {opacity:0} 5.38%,100% {opacity:1} }
  @keyframes d8_6 { 0%,6.15% {stroke-dashoffset:1;animation-timing-function:cubic-bezier(.8,0,.2,1)} 10.77%,100% {stroke-dashoffset:0} }
  @keyframes w8_6 { 0%,9.23% {stroke-width:3;animation-timing-function:cubic-bezier(.8,0,.2,1)} 13.85%,100% {stroke-width:11} }
  @keyframes o8_6 { 0%,6.15% {opacity:0} 7.69%,100% {opacity:1} }
  @keyframes d12_11 { 0%,9.23% {stroke-dashoffset:1;animation-timing-function:cubic-bezier(.8,0,.2,1)} 17.69%,100% {stroke-dashoffset:0} }
  @keyframes w12_11 { 0%,12.31% {stroke-width:3;animation-timing-function:cubic-bezier(.8,0,.2,1)} 20.77%,100% {stroke-width:11} }
  @keyframes o12_11 { 0%,9.23% {opacity:0} 10.77%,100% {opacity:1} }
  @keyframes d22_7 { 0%,16.92% {stroke-dashoffset:1;animation-timing-function:cubic-bezier(.8,0,.2,1)} 22.31%,100% {stroke-dashoffset:0} }
  @keyframes w22_7 { 0%,20.00% {stroke-width:3;animation-timing-function:cubic-bezier(.8,0,.2,1)} 25.38%,100% {stroke-width:11} }
  @keyframes o22_7 { 0%,16.92% {opacity:0} 18.46%,100% {opacity:1} }
  @keyframes d24_7 { 0%,18.46% {stroke-dashoffset:1;animation-timing-function:cubic-bezier(.8,0,.2,1)} 23.85%,100% {stroke-dashoffset:0} }
  @keyframes w24_7 { 0%,21.54% {stroke-width:3;animation-timing-function:cubic-bezier(.8,0,.2,1)} 26.92%,100% {stroke-width:11} }
  @keyframes o24_7 { 0%,18.46% {opacity:0} 20.00%,100% {opacity:1} }
  @keyframes d26_7 { 0%,20.00% {stroke-dashoffset:1;animation-timing-function:cubic-bezier(.8,0,.2,1)} 25.38%,100% {stroke-dashoffset:0} }
  @keyframes w26_7 { 0%,23.08% {stroke-width:3;animation-timing-function:cubic-bezier(.8,0,.2,1)} 28.46%,100% {stroke-width:11} }
  @keyframes o26_7 { 0%,20.00% {opacity:0} 21.54%,100% {opacity:1} }
  @keyframes d28_7 { 0%,21.54% {stroke-dashoffset:1;animation-timing-function:cubic-bezier(.8,0,.2,1)} 26.92%,100% {stroke-dashoffset:0} }
  @keyframes w28_7 { 0%,24.62% {stroke-width:3;animation-timing-function:cubic-bezier(.8,0,.2,1)} 30.00%,100% {stroke-width:11} }
  @keyframes o28_7 { 0%,21.54% {opacity:0} 23.08%,100% {opacity:1} }
  @keyframes pop { 0%,14.62% {transform:scale(0);animation-timing-function:cubic-bezier(.2,1.6,.4,1)} 21.54%,100% {transform:scale(1)} }
  @keyframes glow { 0%,15.38% {opacity:0;animation-timing-function:ease-out} 24.62%,100% {opacity:1} }
  @keyframes spark { 0%,19.23% {transform:scale(0);animation-timing-function:ease-out} 24.15% {transform:scale(1.4) rotate(45deg)} 31.54%,100% {transform:scale(1) rotate(90deg)} }
  @keyframes loopfade { 0%,94% {opacity:1} 100% {opacity:0} }
</style>
<defs><radialGradient id="bg" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#1c1d25"/><stop offset="1" stop-color="#0D0E12"/></radialGradient></defs>
<rect x="20" y="10" width="580" height="210" rx="16" fill="url(#bg)"/>
<g class="all">
  <g class="ink">
    <g class="shadow">
      <!-- H, narrowed and nudged right so it sits close to the a -->
      <g transform="translate(26 0)">
        <path pathLength="1" style="animation:d2_10 13.0s infinite, w2_10 13.0s infinite, o2_10 13.0s infinite" d="M38 86C40 58 70 42 96 46C116 50 114 74 106 104C98 134 90 158 84 178"/>
