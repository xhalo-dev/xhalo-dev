<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="20 10 580 210" width="900" height="326">
<title>Haloxx</title>
<style>
  svg { --pink:#F6B6CF; --pink-deep:#E58FB2; --bg:#0D0E12; }
    
  /* stroke-draw, like the reference: dash in, then the pen thickens */
  .ink path {
    fill:none; stroke-linecap:round; stroke-linejoin:round;
    stroke-width:3; stroke-dasharray:1; stroke-dashoffset:1; opacity:0;
    animation:
      dash var(--dur,1s) cubic-bezier(.8,0,.2,1) var(--d) forwards,
      thick var(--dur,1s) cubic-bezier(.8,0,.2,1) calc(var(--d) + .4s) forwards,
      fade .2s linear var(--d) forwards;
  }
  @keyframes dash  { to { stroke-dashoffset:0; } }
  @keyframes thick { to { stroke-width:11; } }
  @keyframes fade  { to { opacity:1; } }

  .shadow { stroke:#050507; transform:translate(3px,4px); }
  .main   { stroke:var(--pink); filter:drop-shadow(0 0 6px rgba(246,182,207,.4)); }

  /* eclipse "o" */
  .eclipse { transform-origin:385px 150px; transform:scale(0); animation:pop .9s cubic-bezier(.2,1.6,.4,1) 1.9s forwards; }
  .halo    { transform-origin:385px 150px; animation:spin 30s linear infinite; }
  .glow    { opacity:0; animation:fade 1.2s ease-out 2s forwards, breathe 4s ease-in-out 3.2s infinite; }
  .spark   { transform-origin:404px 128px; transform:scale(0); animation:twinkle 1.6s ease-out 2.5s forwards; }
  @keyframes pop     { to { transform:scale(1); } }
  @keyframes spin    { to { transform:rotate(360deg); } }
  @keyframes breathe { 50% { opacity:.65; } }
  @keyframes twinkle { 40% { transform:scale(1.4) rotate(45deg); } to { transform:scale(1) rotate(90deg); } }

  /* little blossoms on the letters */
  .bloom { opacity:0; animation:fade .5s ease-out var(--d) forwards; }

    @media (prefers-reduced-motion: reduce) { .halo { animation:none; } }
</style>
<defs><radialGradient id="bg" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#1c1d25"/><stop offset="1" stop-color="#0D0E12"/></radialGradient></defs>
<rect x="20" y="10" width="580" height="210" rx="16" fill="url(#bg)"/>
  <g class="ink">
    <g class="shadow">
      <!-- H, narrowed and nudged right so it sits close to the a -->
      <g transform="translate(26 0)">
        <path pathLength="1" style="--d:.2s" d="M38 86C40 58 70 42 96 46C116 50 114 74 106 104C98 134 90 158 84 178"/>
        <path pathLength="1" style="--d:.5s;--dur:.8s" d="M178 44C168 90 158 140 152 178"/>
        <path pathLength="1" style="--d:.8s;--dur:.6s" d="M72 132C105 122 140 118 180 120"/>
      </g>
      <!-- a + l -->
      <path pathLength="1" style="--d:1.2s;--dur:1.1s" d="M262 132C250 118 222 122 216 148C210 172 232 184 248 170C258 160 264 140 266 124C262 150 260 175 276 178C295 178 305 150 312 110C318 80 322 50 312 42C300 36 292 60 292 90C292 130 292 170 310 178C320 182 330 176 338 168"/>
      <!-- x -->
      <path pathLength="1" style="--d:2.2s;--dur:.7s" d="M430 128C442 122 452 130 456 150C460 172 470 182 486 172"/>
      <path pathLength="1" style="--d:2.4s;--dur:.7s" d="M490 128C476 124 462 140 456 152C450 166 440 182 424 176"/>
      <!-- x -->
      <path pathLength="1" style="--d:2.6s;--dur:.7s" d="M500 128C512 122 522 130 526 150C530 172 540 182 556 172"/>
      <path pathLength="1" style="--d:2.8s;--dur:.7s" d="M560 128C546 124 532 140 526 152C520 166 510 182 494 176"/>
    </g>
    <g id="letters" class="main">
      <!-- H, narrowed and nudged right so it sits close to the a -->
      <g transform="translate(26 0)">
        <path pathLength="1" style="--d:.2s" d="M38 86C40 58 70 42 96 46C116 50 114 74 106 104C98 134 90 158 84 178"/>
        <path pathLength="1" style="--d:.5s;--dur:.8s" d="M178 44C168 90 158 140 152 178"/>
        <path pathLength="1" style="--d:.8s;--dur:.6s" d="M72 132C105 122 140 118 180 120"/>
      </g>
      <!-- a + l -->
      <path pathLength="1" style="--d:1.2s;--dur:1.1s" d="M262 132C250 118 222 122 216 148C210 172 232 184 248 170C258 160 264 140 266 124C262 150 260 175 276 178C295 178 305 150 312 110C318 80 322 50 312 42C300 36 292 60 292 90C292 130 292 170 310 178C320 182 330 176 338 168"/>
      <!-- x -->
      <path pathLength="1" style="--d:2.2s;--dur:.7s" d="M430 128C442 122 452 130 456 150C460 172 470 182 486 172"/>
      <path pathLength="1" style="--d:2.4s;--dur:.7s" d="M490 128C476 124 462 140 456 152C450 166 440 182 424 176"/>
      <!-- x -->
      <path pathLength="1" style="--d:2.6s;--dur:.7s" d="M500 128C512 122 522 130 526 150C530 172 540 182 556 172"/>
      <path pathLength="1" style="--d:2.8s;--dur:.7s" d="M560 128C546 124 532 140 526 152C520 166 510 182 494 176"/>
    </g>
  </g>
  <defs>
    <radialGradient id="g-glow">
      <stop offset=".45" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#F6B6CF" stop-opacity=".6"/>
      <stop offset="1" stop-color="#F6B6CF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-disc" cx=".4" cy=".35">
      <stop offset="0" stop-color="#22232b"/>
      <stop offset="1" stop-color="#050507"/>
    </radialGradient>
    <ellipse id="pt" cx="0" cy="-36" rx="5" ry="8"/>
  </defs>


  <!-- eclipse replaces the "o" -->
  <g class="eclipse">
    <circle class="glow" cx="385" cy="150" r="58" fill="url(#g-glow)"/>
    <g class="halo" fill="#fff" opacity=".9" ><use href="#pt" fill="#F6B6CF" transform="translate(385 150) rotate(0.0) scale(0.80)"/><use href="#pt" fill="#fff" transform="translate(385 150) rotate(22.4) scale(0.92)"/><use href="#pt" fill="#fff" transform="translate(385 150) rotate(32.7) scale(1.04)"/><use href="#pt" fill="#F6B6CF" transform="translate(385 150) rotate(55.1) scale(1.16)"/><use href="#pt" fill="#fff" transform="translate(385 150) rotate(65.5) scale(0.80)"/><use href="#pt" fill="#fff" transform="translate(385 150) rotate(87.8) scale(0.92)"/><use href="#pt" fill="#F6B6CF" transform="translate(385 150) rotate(98.2) scale(1.04)"/><use href="#pt" fill="#fff" transform="translate(385 150) rotate(120.5) scale(1.16)"/><use href="#pt" fill="#fff" transform="translate(385 150) rotate(130.9) scale(0.80)"/><use href="#pt" fill="#F6B6CF" transform="translate(385 150) rotate(153.3) scale(0.92)"/><use href="#pt" fill="#fff" transform="translate(385 150) rotate(163.6) scale(1.04)"/><use href="#pt" fill="#fff" transform="translate(385 150) rotate(186.0) scale(1.16)"/><use href="#pt" fill="#F6B6CF" transform="translate(385 150) rotate(196.4) scale(0.80)"/><use href="#pt" fill="#fff" transform="translate(385 150) rotate(218.7) scale(0.92)"/><use href="#pt" fill="#fff" transform="translate(385 150) rotate(229.1) scale(1.04)"/><use href="#pt" fill="#F6B6CF" transform="translate(385 150) rotate(251.5) scale(1.16)"/><use href="#pt" fill="#fff" transform="translate(385 150) rotate(261.8) scale(0.80)"/><use href="#pt" fill="#fff" transform="translate(385 150) rotate(284.2) scale(0.92)"/><use href="#pt" fill="#F6B6CF" transform="translate(385 150) rotate(294.5) scale(1.04)"/><use href="#pt" fill="#fff" transform="translate(385 150) rotate(316.9) scale(1.16)"/><use href="#pt" fill="#fff" transform="translate(385 150) rotate(327.3) scale(0.80)"/><use href="#pt" fill="#F6B6CF" transform="translate(385 150) rotate(349.6) scale(0.92)"/></g>
    <circle cx="385" cy="150" r="27" fill="url(#g-disc)"/>
    <path class="spark" fill="#fff" d="M404 116l2 10 10 2-10 2-2 10-2-10-10-2 10-2z"/>
  </g>

  <!-- tiny sakura dots that appear once the letters are inked -->
  <g fill="#fff" opacity=".9">
    <circle class="bloom" style="--d:1.4s" cx="119" cy="150" r="2.2"/>
    <circle class="bloom" style="--d:1.6s" cx="194" cy="100" r="2.2"/>
    <circle class="bloom" style="--d:1.9s" cx="230" cy="168" r="2.2"/>
    <circle class="bloom" style="--d:2.1s" cx="307" cy="80" r="2.2"/>
    <circle class="bloom" style="--d:3.3s" cx="468" cy="168" r="2.2"/>
    <circle class="bloom" style="--d:3.5s" cx="535" cy="140" r="2.2"/>
  </g>
</svg>